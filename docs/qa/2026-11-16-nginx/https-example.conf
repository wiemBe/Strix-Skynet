# Managed by Skynet install_nginx_rhel.py
# Backend stays private; all UI, API, reports and downloads use this proxy.
log_format skynet_safe '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time';
server {
    listen 10.90.10.10:80 default_server;
    server_name 10.90.10.10;
    access_log /var/log/nginx/skynet-access.log skynet_safe;
    return 308 https://10.90.10.10$request_uri;
}
server {
    listen 10.90.10.10:443 ssl default_server;
    server_name 10.90.10.10;
    server_tokens off;
    client_max_body_size 10m;
    access_log /var/log/nginx/skynet-access.log skynet_safe;
    allow 127.0.0.1/32;
    allow 10.90.10.0/24;
    deny all;
    ssl_certificate /etc/pki/tls/certs/skynet.crt;
    ssl_certificate_key /etc/pki/tls/private/skynet.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }
}

# Dry-run only; no packages, service, firewall, data or keys changed.
