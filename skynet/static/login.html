<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skynet · Sign in</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-wrap">
    <form class="card login" id="loginForm" autocomplete="on">
      <div class="brand"><img src="/static/favicon.png" alt="" width="24" height="24">Skynet</div>
      <div class="field"><label for="u">Username</label><input type="text" id="u" name="username" autocomplete="username" required></div>
      <div class="field"><label for="p">Password</label><input type="password" id="p" name="password" autocomplete="current-password" required></div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
